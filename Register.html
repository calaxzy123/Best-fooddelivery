<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | BestFood Delivery</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-card {
            max-width: 420px;
            margin: 40px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .form-item {
            margin-bottom: 16px;
        }
        .form-item label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
        .form-item input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-register:hover {
            background: #059669;
        }
        .btn-register:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="header-container">
            <h1 class="logo">🍴 BestFood Delivery</h1>
            <nav>
                <a href="index.html">หน้าแรก</a>
                <a href="restaurants.html">ร้านอาหาร</a>
                <a href="cart.html">🛒 ตะกร้า (<span id="cart-count">0</span>)</a>
                <a href="order.html">📦 คำสั่งซื้อ</a>
                <a href="login.html" id="authNav">เข้าสู่ระบบ</a>
            </nav>
        </div>
    </header>

    <main class="register-card">
        <h2 style="margin-top: 0; margin-bottom: 20px;">สมัครสมาชิก</h2>

        <form id="register-form">
            <div class="form-item">
                <label for="name">ชื่อผู้ใช้งาน</label>
                <input type="text" id="name" required placeholder="กรอกชื่อ-นามสกุล">
            </div>

            <div class="form-item">
                <label for="email">อีเมล (Email)</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>

            <div class="form-item">
                <label for="password">รหัสผ่าน (Password)</label>
                <input type="password" id="password" required placeholder="กรอกรหัสผ่านอย่างน้อย 4 ตัวอักษร">
            </div>

            <div class="form-item">
                <label for="confirm-password">ยืนยันรหัสผ่านอีกครั้ง</label>
                <input type="password" id="confirm-password" required placeholder="กรอกรหัสผ่านอีกครั้ง">
            </div>

            <button type="submit" id="btnSubmit" class="btn-register">
                สมัครสมาชิก
            </button>
        </form>

        <p style="margin-top: 20px; text-align: center; font-size: 14px; color: #666;">
            มีบัญชีอยู่แล้ว? <a href="login.html" style="color: #10b981; font-weight: bold; text-decoration: none;">เข้าสู่ระบบ</a>
        </p>
    </main>

    <footer>
        <p>© 2026 Food Delivery</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const registerForm = document.getElementById("register-form");
        const btnSubmit = document.getElementById("btnSubmit");

        registerForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password.length < 4) {
                alert("กรุณาตั้งรหัสผ่านอย่างน้อย 4 ตัวอักษร");
                return;
            }

            if (password !== confirmPassword) {
                alert("รหัสผ่านไม่ตรงกัน กรุณากรอกใหม่อีกครั้ง");
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ กำลังสมัครสมาชิก...";

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    alert(data.message || "เกิดข้อผิดพลาดในการสมัครสมาชิก");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "สมัครสมาชิก";
                    return;
                }

                alert("สมัครสมาชิกสำเร็จ 🎉 กรุณาเข้าสู่ระบบ");
                window.location.href = "login.html";

            } catch (error) {
                console.error("Register Error:", error);
                alert("ไม่สามารถเชื่อมต่อกับ Server ได้ กรุณาลองใหม่อีกครั้ง");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "สมัครสมาชิก";
            }
        });
    </script>
</body>
</html>
