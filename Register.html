<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | BestFood Delivery</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="main-header">
        <div class="header-container">
            <h1 class="logo">🍴 BestFood Delivery</h1>
            <nav>
                <a href="index.html">หน้าแรก</a>
                <a href="restaurants.html">ร้านอาหาร</a>
                <a href="cart.html">🛒 ตะกร้า (<span id="cart-count">0</span>)</a>
                <a href="order.html">📦 คำสั่งซื้อ</a>
                <a href="login.html" id="authNav">เข้าสู่ระบบ</a>
            </nav>
        </div>
    </header>

    <main style="max-width: 400px; margin: 40px auto; padding: 20px; background: white; border-radius: 8px;">
        <h2>สมัครสมาชิก</h2>

        <form id="register-form">
            <div>
                <label for="name">ชื่อ</label><br>
                <input type="text" id="name" required placeholder="กรอกชื่อ" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <br>
            <div>
                <label for="email">Email</label><br>
                <input type="email" id="email" required placeholder="กรอก Email" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <br>
            <div>
                <label for="password">Password</label><br>
                <input type="password" id="password" required placeholder="กรอกรหัสผ่าน" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <br>
            <div>
                <label for="confirm-password">ยืนยัน Password</label><br>
                <input type="password" id="confirm-password" required placeholder="กรอกรหัสผ่านอีกครั้ง" style="width: 100%; padding: 8px; margin-top: 5px;">
            </div>
            <br>
            <button type="submit" style="width: 100%; padding: 10px; background: #e53935; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                สมัครสมาชิก
            </button>
        </form>

        <p style="margin-top: 15px; text-align: center;">
            มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
        </p>
    </main>

    <footer>
        <p>© 2026 Food Delivery</p>
    </footer>

    <script src="script.js"></script>
    <script>
        const registerForm = document.getElementById("register-form");

        registerForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                alert("รหัสผ่านไม่ตรงกัน กรุณากรอกใหม่");
                return;
            }

            try {
                // แก้ไขเป็น /api/register เพื่อเรียก API ได้โดยตรงทั้งบน Render และ Local
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    alert(data.message || "เกิดข้อผิดพลาดในการสมัครสมาชิก");
                    return;
                }

                alert("สมัครสมาชิกสำเร็จ 🎉");
                window.location.href = "login.html";

            } catch (error) {
                console.error("Register Error:", error);
                alert("ไม่สามารถเชื่อมต่อกับ Server ได้ กรุณาลองใหม่อีกครั้ง");
            }
        });
    </script>
</body>
</html>
